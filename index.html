  [600,'#68c9fc'], [650,'#ff7931'], [500,'#ba91f4'], [700,'#ffe334'],
  [500,'#ffaab7'], [600,'#f23657'], [550,'#68c9fc'], [500,'#7bce90'],

let db=null,auth=null,uid=null,live=false,role='landing',code='',session=null,unsub=null,playerName='',picked='',localBank=loadBank(),hostKey=null,hostAnswers={};
let previewPlayers={},previewResponses={},lastTimerValue=null,soundOn=true,route=new URLSearchParams(location.search);

db.ref('.info/serverTimeOffset').on('value', snapshot => {

function initialSession(mode){return {hostUid:uid||'preview',mode,game:'jeopardy',status:'lobby',round:0,questionIndex:-1,question:null,deadline:0,duration:15,revealed:false,revealedLetters:'',found:[],message:'Waiting for host to start',createdAt:Date.now(),teams:TEAMS}}
async function hostCreate(){if(!live){role='host';code='PREVIEW';session=initialSession($('#mode').value);previewPlayers={};previewResponses={};render();return}hostKey=crypto.randomUUID();let c;for(let i=0;i<5;i++){c=rand();if(!(await db.ref('sessions/'+c).once('value')).exists())break}code=c;session=initialSession($('#mode').value);await db.ref('sessions/'+code).set(session);localStorage.setItem('rcrHostSession',JSON.stringify({code,hostToken:hostKey}));role='host';subscribe();render()}

async function joinSession(){let c=clean($('#joinCode').value,6).replace(/\D/g,'');let n=clean($('#nickname').value,25);if(!live){toast('Phone joining requires Firebase setup and GitHub Pages hosting.');return}if(c.length!==6||!n){toast('Enter a six-digit PIN and nickname');return}let snap=await db.ref('sessions/'+c).once('value');if(!snap.exists()){toast('No active session with that PIN');return}code=c;playerName=n;const team=($('#teamPicker')?.value||TEAMS[0]);if(!snap.child('players/'+uid).exists())await db.ref('sessions/'+code+'/players/'+uid).set({name:n,team,score:0,joinedAt:Date.now()});role='player';subscribe();render()}

    questionIndex: index, round, question: published, wheel: null,

async function scoreUser(id,points){if(!live){const p=previewPlayers[id];if(p){p.score=(p.score||0)+points;render()}return}const r=db.ref('sessions/'+code+'/players/'+id+'/score');await r.transaction(x=>(x||0)+points)}
async function reveal(){if(wheelIsMoving())return;if(session?.revealed)return toast('This round was already scored');let q=answerForRound();if(!q)return;let patch={status:'revealed',deadline:0,revealed:true,message:'Round complete'};if(q.g==='wheel')patch.wheelPattern=q.q;if(q.g==='feud')patch.found=(q.answers||[]).map((_,i)=>i);await update(patch);if(q.g==='jeopardy'&&live){let rs=responses(),ps=players();for(let [id,r] of Object.entries(rs)){if(!ps[id])continue;const correct=Number(r.value)===Number(q.a);if(correct)await scoreUser(id,Number(q.pts)||100)}}beep(940)}

function board(){let qs=gameQs();if(!qs.length)return '<p>No questions. Add one in the facilitator editor.</p>';if(session.game==='jeopardy'){let cats=[...new Set(qs.map(q=>q.cat))];return '<div class="grid">'+cats.map(c=>'<div><h3>'+esc(c)+'</h3>'+qs.map((q,i)=>q.cat===c?`<button class="secondary" style="width:100%;margin:3px 0" onclick="startQuestion(${i})">${esc(q.pts)} points</button>`:'').join('')+'</div>').join('')+'</div>'}return '<div class="grid">'+qs.map((q,i)=>`<button class="secondary" onclick="startQuestion(${i})">${esc(q.cat)} · ${esc(q.g === 'wheel' ? 'Puzzle ' + (i + 1) : q.q)}</button>`).join('')+'</div>'}
function gameNow() {
  return Date.now() + serverOffset;
}

function roundDuration(room) {
  return (room.game === 'wheel' ? room.wheelDuration || 20 : room.duration || 15) * 1000;
}

function wheelIsMoving(now = gameNow()) {
  return session?.question?.g === 'wheel' && !!session.wheel && now < session.wheel.endsAt;
}

function canAnswer(now = gameNow()) {
  return session?.status === 'playing' && now < session.deadline && !wheelIsMoving(now);
}

function getTime() {
  if (!canAnswer()) return 0;
  return Math.ceil((session.deadline - gameNow()) / 1000);
}

function maskPhrase(phrase, letters = new Set()) {
  return phrase.replace(/[A-Z]/gi, letter => letters.has(letter.toUpperCase()) ? letter : '▢');
}

function wheelWedges(spin) {
  return spin && spin.layout !== 'reference' ? LEGACY_WEDGES : PHOTO_WEDGES;
}

function wheelOutcome(spin = session?.wheel) {
  return wheelWedges(spin)[spin?.segment]?.[0];
}

function wheelPoints() {
  const outcome = wheelOutcome();
  return typeof outcome === 'number' ? outcome : undefined;
}

function wheelCanSpin(room) {
  const spin = room?.wheel;
  return room?.question?.g === 'wheel' && !room.revealed &&
    (!spin || (gameNow() >= spin.endsAt && typeof wheelOutcome(spin) === 'string'));
}

function wheelAngle(spin) {
  return spin ? (360 - spin.segment * 360 / wheelWedges(spin).length) % 360 : 0;
}

async function spinWheel() {
  const room = session;

  spinPending = true;
  try {
    if (soundOn) {
      try {
        wheelAudio ||= new (window.AudioContext || window.webkitAudioContext)();
        wheelAudio.resume().catch(() => {});
      } catch {}
    }

    const segment = Math.floor(Math.random() * PHOTO_WEDGES.length);
    const isPoints = typeof PHOTO_WEDGES[segment][0] === 'number';
    const spinPatch = current => {
      const startsAt = gameNow() + (live ? 450 : 0);
      const endsAt = startsAt + SPIN_MS;
      return {
        wheel: {layout: 'reference', segment, startsAt, endsAt, fromAngle: wheelAngle(current.wheel)},
        status: isPoints ? 'playing' : 'paused',
        deadline: isPoints ? endsAt + roundDuration(current) : 0
      };
    };

    if (live) {
      await db.ref('sessions/' + code).transaction(current => {
        if (!current || current.hostUid !== uid || current.round !== room.round ||
            current.wheel?.startsAt !== room.wheel?.startsAt || !wheelCanSpin(current)) return;
        return {...current, ...spinPatch(current)};
      }, undefined, false);
    } else {
      await update(spinPatch(room));
    }
  } finally {
    spinPending = false;
  }
}

function renderWheel() {
  const wedges = wheelWedges(session.wheel);
  const step = 360 / wedges.length;
  const colors = wedges.map(([,color], index) =>
    `${color} ${index * step}deg ${(index + 1) * step}deg`).join(',');
  const hasSpecial = typeof wheelOutcome() === 'string';
  return `<div class="wheel-area">
    <div class="wheel-frame" aria-hidden="true">
      <div class="wheel-pointer"></div>
      <div class="wheel-pointer left"></div>
      <div class="wheel-pointer right"></div>
      <div class="wheel-disc" style="background:conic-gradient(from -${step / 2}deg,${colors})">
        ${wedges.map(([value], index) => {
          const special = typeof value === 'string';
          const labelClass = special ? (value === 'Bankrupt' ? ' special bankrupt' : ' special') : '';
          return `<span class="wheel-wedge" style="transform:rotate(${index * step}deg)"><span class="wheel-wedge-label${labelClass}">${value}</span></span>`;
        }).join('')}
        <span class="wheel-hub">RCR</span>
      </div>
    </div>
    <p id="wheelResult" class="wheel-result" role="status"></p>
    ${role === 'host' && !session.revealed && (!session.wheel || hasSpecial) ?
      `<button id="spinButton" onclick="spinWheel()" ${wheelIsMoving() ? 'hidden' : ''}>${hasSpecial ? 'Spin again' : 'Spin the wheel'}</button>` : ''}
  </div>`;
}

function wheelTone(frequency, duration, volume, delay = 0) {
  const starts = wheelAudio.currentTime + delay;
  const oscillator = wheelAudio.createOscillator();
  const gain = wheelAudio.createGain();
  oscillator.frequency.value = frequency;
  oscillator.connect(gain).connect(wheelAudio.destination);
  gain.gain.setValueAtTime(volume, starts);
  gain.gain.exponentialRampToValueAtTime(0.001, starts + duration);
  oscillator.start(starts);
  oscillator.stop(starts + duration);
}

function animateWheel() {
  cancelAnimationFrame(wheelFrame);
  const disc = $('.wheel-disc');
  if (!disc) return;

  const spin = session.wheel;
  const outcome = wheelOutcome(spin);
  const result = $('#wheelResult');
  if (outcome === undefined) {
    result.textContent = role === 'host' ? 'Ready to spin' : 'Waiting for the facilitator to spin';
    return;
  }

  const step = 360 / wheelWedges(spin).length;
  const from = spin.fromAngle || 0;
  const rotation = 5 * 360 + (360 + wheelAngle(spin) - from) % 360;
  const isPoints = typeof outcome === 'number';
  function draw() {
    const now = gameNow();
    const progress = Math.max(0, Math.min(1, (now - spin.startsAt) / (spin.endsAt - spin.startsAt)));
    const angle = from + rotation * (1 - Math.pow(1 - progress, 3));
    disc.style.transform = `rotate(${reduceMotion.matches && progress < 1 ? from : angle}deg)`;
    const landing = isPoints ? `${outcome.toLocaleString('en-US')} points` : `${outcome} · Spin again`;
    const label = progress < 1 ? 'Spinning…' : landing;
    if (result.textContent !== label) result.textContent = label;

    if (role === 'host' && soundOn && wheelAudio?.state === 'running') {
      if (progress > 0 && progress < 1) {
        const marker = spin.startsAt + ':' + Math.floor((angle + step / 2) / step);
        if (lastWheelTick !== marker) {
          lastWheelTick = marker;
          wheelTone(740, 0.023, 0.07);
        }
      } else if (progress === 1 && now - spin.endsAt < 650 && lastWheelLanding !== spin.startsAt) {
        lastWheelLanding = spin.startsAt;
        if (isPoints) {
          wheelTone(523.25, 0.21, 0.11);
          wheelTone(659.25, 0.23, 0.1, 0.09);
          wheelTone(783.99, 0.31, 0.1, 0.18);
        } else {
          wheelTone(330, 0.22, 0.1);
          wheelTone(220, 0.32, 0.1, 0.11);
        }
      }
    }

    if (progress < 1) wheelFrame = requestAnimationFrame(draw);
    else if ($('#spinButton')) $('#spinButton').hidden = false;
  }
  draw();
}
function scoreTable(){let ps=Object.entries(players()).map(([id,p])=>({id,...p}));if(!ps.length)return '<p class="muted">No clients joined yet.</p>';if(session.mode==='teams'){const scores=TEAMS.map(t=>({team:t,score:ps.filter(p=>p.team===t).reduce((sum,p)=>sum+(p.score||0),0),count:ps.filter(p=>p.team===t).length}));return '<div class="grid">'+scores.map(p=>`<div class="team">${esc(p.team)} · ${p.count} clients <b class="score">${p.score}</b></div>`).join('')+'</div>'}return '<div class="grid">'+ps.sort((a,b)=>(b.score||0)-(a.score||0)).map(p=>`<div class="team">${esc(p.name)} <b class="score">${p.score||0}</b></div>`).join('')+'</div>'}
function hostRound(){if(!session.question)return `<div class="panel"><h2>Choose a question</h2>${board()}</div>`;let q=session.question,ans=answerForRound(),rs=responses(),ps=players();const points=q.g==='wheel'?wheelPoints():q.pts;return `<div class="panel"><div class="row spread"><span class="pill">${esc(GAMES.find(x=>x[0]===session.game)?.[2])} · ${esc(q.cat)}${points && !wheelIsMoving() ? ' · '+esc(points)+' pts' : ''}</span><span id="timer" class="timer">${getTime()}</span></div><div class="question">${esc(q.q)}</div>${q.hint?`<p>Hint: ${esc(q.hint)}</p>`:''}${q.g==='jeopardy'?`<div class="choices">${q.choices.map((c,i)=>`<div class="choice ${session.revealed&&ans?.a===i?'correct':''}" style="padding:12px;border-radius:10px">${String.fromCharCode(65+i)}. ${esc(c)}</div>`).join('')}</div>`:''}${q.g==='wheel'?`${renderWheel()}<div class="puzzle">${esc(session.wheelPattern || maskPhrase(ans?.q || ""))}</div><div class="row"><input id="letterBox" maxlength="1" placeholder="Letter"><button class="secondary" onclick="revealLetter()">Reveal letter</button></div>`:''}${q.g==='feud'?`<div class="grid">${(ans?.answers||[]).map((a,i)=>`<button onclick="markFeud(${i})" class="${(session.found||[]).includes(i)?'':'secondary'}">${(session.found||[]).includes(i)?esc(a):'Answer '+(i+1)+' · Tap to reveal'}</button>`).join('')}</div>`:''}<div class="row" style="margin-top:16px"><button onclick="restartTimer()" ${session.revealed || wheelIsMoving() || (q.g==='wheel' && !wheelPoints()) ? 'disabled' : ''}>↻ Start ${roundDuration(session)/1000}-sec timer</button><button class="secondary" onclick="stopTimer()" ${!canAnswer() ? 'disabled' : ''}>Pause</button><button onclick="reveal()" ${wheelIsMoving() ? 'disabled' : ''}>Reveal / Close round</button><button class="secondary" onclick="update({question:null,status:'lobby',deadline:0,wheel:null,wheelPattern:null,responses:null})">New question</button></div>${session.revealed?`<div class="status">${q.g==='jeopardy'?'Correct answer: '+esc(ans?.choices?.[ans?.a]):q.g==='wheel'?'Solution: '+esc(ans?.q):'All survey answers revealed'}</div>`:''}</div><div class="panel"><h2>Responses (${Object.keys(rs).length})</h2>${Object.entries(rs).length?Object.entries(rs).map(([id,r])=>`<div class="submission submit-card"><div><b>${esc(ps[id]?.name||'Player')}</b> <span class="tag">${esc(ps[id]?.team||'')}</span><div>${q.g==='jeopardy'?esc(q.choices[Number(r.value)]||'Unknown'):esc(r.value)}</div></div><div class="row"><button class="secondary" onclick="scoreUser('${id}',${Number(points)||0})">+${esc(points)} pts</button><button class="secondary" onclick="scoreUser('${id}',-${Number(points)||0})">−${esc(points)} pts</button></div></div>`).join(''):'<p class="muted">Waiting for answers from connected phones.</p>'}<p class="note">Jeopardy awards correct answers automatically when you click Reveal. Manual +/− buttons are for corrections, Wheel, and Feud. Avoid scoring the same response twice.</p></div>`}
function renderHost(){let share=live?`<div class="pin">${code}</div><p>Clients open <a target="_blank" href="${esc(link())}">${esc(link())}</a></p><div class="row"><button onclick="copyJoin()">Copy join link</button><button class="secondary" onclick="window.print()">Print page</button></div>`:`<div class="status warn"><b>Local preview only.</b> The host dashboard and question bank work here. To connect clients on their own phones, configure Firebase and publish this file on GitHub Pages.</div>`;
return `<div class="panel"><div class="row spread"><div><h1>Facilitator dashboard</h1><p class="muted">${session.mode==='teams'?'Team competition':'Individual scoring'} · ${Object.keys(players()).length} joined</p></div><button class="danger" onclick="endSession()">End room</button></div>${share}</div><div class="panel"><div class="row spread"><h2>Choose a game</h2><div class="row"><label>Timer (seconds)<input type="number" min="5" max="120" style="width:95px" value="${roundDuration(session)/1000}" onchange="update({[session.game==='wheel'?'wheelDuration':'duration']:Math.min(120,Math.max(5,Number(this.value)||roundDuration(session)/1000))})"></label><button class="secondary" onclick="soundOn=!soundOn;toast('Sound '+(soundOn?'on':'off'))">🔊 Toggle sound</button></div></div><div class="gamegrid">${GAMES.map(g=>`<div class="gamecard ${session.game===g[0]?'selected':''}" onclick="selectGame('${g[0]}')"><div style="font-size:32px">${g[1]}</div><b>${g[2]}</b><p class="small">${g[3]}</p></div>`).join('')}</div></div>${hostRound()}<div class="panel"><div class="row spread"><h2>Live scoreboard</h2><button class="secondary" onclick="resetScores()">Reset scores</button></div>${scoreTable()}</div><div class="panel"><details><summary>✏️ Add / edit game questions</summary><p class="note">Custom questions are saved in this facilitator's browser. Publish the updated HTML to make built-in content universal.</p><div class="grid"><label>Game<select id="editGame"><option value="jeopardy">Jeopardy</option><option value="wheel">Wheel of Fortune</option><option value="feud">Family Feud</option></select></label><label>Category<input id="editCat" placeholder="Recovery Skills"></label><label>Points<input id="editPts" type="number" value="100" min="1"></label></div><label>Question or puzzle phrase<input id="editQ" placeholder="Enter your question"></label><label>Options / survey answers (one per line). For Jeopardy, enter four options and make the first correct.<textarea id="editAnswers" placeholder="Correct answer\nOther answer\nOther answer\nOther answer"></textarea></label><button onclick="addQuestion()">Add question</button> <button class="secondary" onclick="exportBank()">Export questions JSON</button> <button class="secondary" onclick="document.getElementById('importBank').click()">Import questions</button><input class="hidden" id="importBank" type="file" accept="application/json" onchange="importBank(event)"><button class="danger" onclick="resetBank()">Restore built-in questions</button><p class="note">To change which Jeopardy option is correct, import a JSON bank with the <code>a</code> index (0–3). Or put the correct option first when adding questions.</p></details></div>`}
function renderPlayer(){if(!session)return '<div class="panel">Loading room…</div>';let p=players()?.[uid];if(!p)return '<div class="panel"><h2>Not in room</h2><button onclick="role=\'join\';render()">Join again</button></div>';let q=session.question;let r=responses()[uid];return `<div class="panel"><div class="row spread"><div><h1>Hello, ${esc(p.name)}!</h1><span class="pill">${esc(session.mode==='teams'?p.team:'Individual mode')} · ${esc(code)}</span></div><span class="score">${p.score||0} pts</span></div></div><div class="panel"><div class="row spread"><span class="pill">${esc(GAMES.find(g=>g[0]===session.game)?.[2])}</span><span id="timer" class="timer">${getTime()}</span></div>${!q?`<div class="bigcenter"><h2>You're in!</h2><p>Waiting for facilitator to start a question.</p></div>`:`<div><div class="question">${esc(q.q)}</div>${q.hint?`<p>Hint: ${esc(q.hint)}</p>`:''}${q.g==='wheel'?`${renderWheel()}<div class="puzzle">${esc(session.wheelPattern || (q.pattern || '').replaceAll('_','▢'))}</div>`:''}${r?`<div class="status">✓ Your answer was submitted: ${esc(q.g==='jeopardy'?q.choices[Number(r.value)]:r.value)}</div>`:canAnswer()?(q.g==='jeopardy'?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="sendAnswer('${i}')">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>`:`<label>Your ${q.g==='wheel'?'letter or full phrase':'survey answer'}<input id="typedAnswer" maxlength="140" placeholder="Type your answer"></label><button style="margin-top:12px" onclick="sendAnswer(document.getElementById('typedAnswer').value)">Submit answer</button>`):`<div class="status">${session.revealed?'Round complete!':q.g==='wheel'&&(!wheelPoints()||wheelIsMoving())?'Guesses open after a points spin.':'Time is up or facilitator paused the round.'}</div>`}</div>`}</div><div class="panel"><h2>Scoreboard</h2>${scoreTable()}</div>`}
function render(){if(!$('#app'))return;if(role==='landing'){ $('#app').innerHTML=`<div class="bigcenter"><h1>Recovery games, together.</h1><p class="muted">Host from your iPad. Clients answer from their own phones.</p></div><div class="grid"><div class="panel"><h2>🎮 Facilitator</h2><p>Create a room, lead the games, and control scoring.</p><label>Competition mode<select id="mode"><option value="individual">Individual players</option><option value="teams">Teams</option></select></label><br><button class="wide" onclick="hostCreate()">Create game room</button></div><div class="panel"><h2>📱 Client</h2><p>Enter the room PIN from your facilitator.</p><button class="wide secondary" onclick="role='join';render()">Join a game</button></div></div><div class="panel"><h2>Included games</h2><div class="gamegrid">${GAMES.map(g=>`<div class="gamecard"><div style="font-size:32px">${g[1]}</div><b>${g[2]}</b><p class="small">${g[3]}</p></div>`).join('')}</div></div>${!live?'<div class="status warn">This copy opens in local preview mode until the facilitator adds Firebase settings. The online multiplayer setup is described in README.md.</div>':''}`;return}if(role==='join'){ $('#app').innerHTML=`<div class="panel" style="max-width:550px;margin:24px auto"><h1>Join game room</h1><label>6-digit room PIN<input id="joinCode" inputmode="numeric" maxlength="6" placeholder="123456" value="${esc(code)}"></label><br><label>Nickname (not your full name)<input id="nickname" maxlength="25" placeholder="e.g. Sunshine"></label><br><label>Team (only used for team games)<select id="teamPicker">${TEAMS.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><br><button class="wide" onclick="joinSession()">Join game</button><p class="note">Do not use full names or share medical information.</p><button class="secondary" onclick="role='landing';render()">Back</button></div>`;return}const roundKey = session ? code + ':' + session.round + ':' + session.game : null;
  const input = $('#typedAnswer') || $('#letterBox');
  const wasFocused = document.activeElement === input;
  const answerDraft = input?.value;
  renderedAnswering = canAnswer();
  $('#app').innerHTML = role==='host' ? renderHost() : renderPlayer();
  if (input && renderedRound === roundKey) {
    const replacement = document.getElementById(input.id);
    if (replacement) {
      replacement.value = answerDraft;
      if (wasFocused) {
        replacement.focus();
        replacement.setSelectionRange(input.selectionStart, input.selectionEnd);
      }
    }
  }
  renderedRound = roundKey;
  animateWheel();}
function copyJoin(){navigator.clipboard.writeText(link()).then(()=>toast('Link copied')).catch(()=>prompt('Copy link:',link()))}
function addQuestion(){let g=$('#editGame').value,cat=clean($('#editCat').value,55),q=clean($('#editQ').value,160),pts=Math.max(1,Number($('#editPts').value)||100),answers=$('#editAnswers').value.split('\n').map(v=>clean(v,120)).filter(Boolean);if(!cat||!q)return toast('Enter a category and question');let v={g,cat,pts,q};if(g==='jeopardy'){if(answers.length!==4)return toast('Jeopardy needs four options (correct one first)');v.choices=answers;v.a=0}if(g==='feud'){if(answers.length<2)return toast('Family Feud needs at least two survey answers');v.answers=answers}if(g==='wheel'){v.q=q.toUpperCase();v.hint=answers[0]||cat}localBank.push(v);saveBank();render()}
function exportBank(){let b=new Blob([JSON.stringify(localBank,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RCR_Game_Questions.json';a.click();URL.revokeObjectURL(a.href)}
function importBank(event){let f=event.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data)||!data.every(q=>['jeopardy','wheel','feud'].includes(q.g)&&typeof q.q==='string'&&typeof q.cat==='string'))throw Error('Invalid question format');localBank=data;saveBank();render()}catch(e){toast('Import error: '+e.message)}};reader.readAsText(f)}
function resetBank(){if(confirm('Restore built-in questions? Custom questions on this device will be erased.')){localBank=QUESTIONS.slice();saveBank();render()}}
setInterval(()=>{let t=$('#timer');if(!t||!session)return;if(canAnswer()!==renderedAnswering){render();return}let n=getTime();t.textContent=n;t.classList.toggle('low',n<=5);if(role==='host'&&session.status==='playing'&&n>0&&n<=3&&lastTimerValue!==n)beep(500);lastTimerValue=n},200);
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Error: '+(e.reason?.message||'Check network and settings'))});initialize();
