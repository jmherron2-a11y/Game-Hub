<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f2f7ff;background:#091526}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#164468 0%,#091526 65%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(16px,calc((100vw - 1150px)/2));border-bottom:1px solid #31506a;background:#0c1d30dd}.logo{font-weight:900;font-size:clamp(19px,3vw,28px);letter-spacing:.02em}.small{color:#bad0e3;font-size:13px}.brand{color:#67dfce}main{max-width:1150px;margin:0 auto;padding:20px 16px 70px}.panel{background:#112840;border:1px solid #34566f;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 26px #0002}.muted{color:#b5cbd9}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.gamecard{background:#173856;border:1px solid #3c6784;padding:17px;border-radius:14px;cursor:pointer}.gamecard:hover,.gamecard.selected{border-color:#69deca;background:#204c61}.gamecard b{font-size:19px}button,select,input,textarea{font:inherit;border-radius:10px}button{background:#22b9aa;color:#06222c;border:0;padding:12px 16px;font-weight:750;cursor:pointer;min-height:44px}button:hover{filter:brightness(1.08)}button.secondary{background:#254a66;color:#e9faff;border:1px solid #4c7690}button.danger{background:#ae3a52;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{padding:11px 12px;background:#0b2034;border:1px solid #50748f;color:#fff;min-height:44px;max-width:100%}textarea{width:100%;min-height:90px}label{display:grid;gap:6px;color:#d4e5ed;font-weight:600;font-size:14px}h1{font-size:clamp(27px,4vw,42px);margin:0 0 8px}h2{font-size:22px;margin:0 0 12px}h3{margin:0 0 9px}.pill{display:inline-block;border-radius:99px;border:1px solid #4c819c;background:#173c55;padding:6px 10px;font-size:13px;font-weight:700}.pin{font-size:38px;font-weight:900;letter-spacing:.14em;color:#7df8d9}.question{font-size:clamp(22px,3.4vw,36px);font-weight:850;line-height:1.26;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.choice{background:#244967;color:#fff;border:2px solid #4b7191;text-align:left}.choice.selected{border-color:#65f0c8;background:#265d67}.choice.correct{background:#12543e;border-color:#64efae}.timer{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;color:#77ffe3}.timer.low{color:#ffb779}.team{display:inline-flex;align-items:center;gap:6px;background:#1c4662;padding:9px 12px;border-radius:10px}.score{font-size:24px;font-weight:900}.submission{padding:11px;margin:8px 0;background:#16354c;border-radius:10px}.submit-card{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.note{font-size:13px;color:#abc6d6}.bigcenter{text-align:center;padding:20px 0}.status{padding:12px 14px;background:#154459;border:1px solid #407c8f;border-radius:10px;margin:12px 0}.warn{background:#583824;border-color:#a7784c}.puzzle{font-size:clamp(24px,5vw,43px);letter-spacing:.15em;word-break:break-word;font-weight:900;line-height:1.6}.tag{font-size:12px;background:#3c5e77;border-radius:8px;padding:4px 7px}.footer{text-align:center;color:#92b1c7;font-size:12px;margin-top:24px}details summary{cursor:pointer;font-weight:700;padding:10px 0}code{color:#9bffdc}a{color:#80f2d7}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:13px 19px;background:#03685e;color:#fff;border-radius:12px;display:none;z-index:10;max-width:90vw}.wide{width:100%}@media(min-width:750px){.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}}@media(max-width:600px){header{padding:14px 16px}.panel{padding:15px}.pin{font-size:31px}.submit-card{align-items:stretch}.submit-card button{flex:1}}
</style></head><body>
<header><div><div class="logo">🌿 RCR <span class="brand">Recovery Game Hub</span></div><div class="small">Learn • Connect • Practice • Recover</div></div><span id="connection" class="pill">Local preview</span></header>
<main><div id="app"></div><div class="footer">For educational group activities. Use nicknames only; do not enter health or treatment information.</div></main><div id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
'use strict';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDTqpzcK4dj3NCezdbWKX9-fSnq6U-SzZc",
  authDomain: "gamification-107fc.firebaseapp.com",
  databaseURL: "https://gamification-107fc-default-rtdb.firebaseio.com",
  projectId: "gamification-107fc",
  storageBucket: "gamification-107fc.firebasestorage.app",
  messagingSenderId: "1086922264636",
  appId: "1:1086922264636:web:8590249177daaa3368b339",

};

const QUESTIONS=[
{g:'jeopardy',cat:'Addiction & Recovery',pts:100,q:'What does a trigger refer to in recovery?',choices:['Something that increases urges or distress','A guaranteed relapse','A type of medication','A punishment'],a:0},
{g:'jeopardy',cat:'Addiction & Recovery',pts:200,q:'Which action best supports recovery after a setback?',choices:['Hide it from everyone','Reach out and review the recovery plan','Give up on treatment','Avoid all support'],a:1},
{g:'jeopardy',cat:'Relapse Prevention',pts:100,q:'HALT is a reminder to check which four states?',choices:['Happy, Active, Lucky, Tired','Hungry, Angry, Lonely, Tired','Hopeful, Aware, Loved, Thankful','Healthy, Alert, Listening, Thinking'],a:1},
{g:'jeopardy',cat:'Relapse Prevention',pts:200,q:'Which is an example of a practical coping plan?',choices:['Wait until a craving goes away','Call a support person and leave a risky situation','Keep urges secret','Challenge yourself by visiting a trigger'],a:1},
{g:'jeopardy',cat:'Emotional Regulation',pts:100,q:'Which is an example of grounding?',choices:['Naming five things you can see','Ignoring your surroundings','Reacting immediately','Holding your breath'],a:0},
{g:'jeopardy',cat:'Emotional Regulation',pts:200,q:'What does “pause before responding” help support?',choices:['Avoiding all feelings','More deliberate choices','Forgetting the problem','Suppressing needs'],a:1},
{g:'jeopardy',cat:'Neurotransmitters',pts:100,q:'Which neurotransmitter is closely involved in motivation and reward learning?',choices:['Dopamine','Melatonin','Insulin','Hemoglobin'],a:0},
{g:'jeopardy',cat:'Neurotransmitters',pts:200,q:'Which neurotransmitter is often associated with inhibitory calming signaling?',choices:['GABA','Adrenaline','Histamine','Acetylcholine'],a:0},
{g:'jeopardy',cat:'Recovery Community',pts:100,q:'Which singer has publicly discussed sobriety and recovery?',choices:['Elton John','Every artist on the radio','No famous musicians','All musicians'],a:0},
{g:'jeopardy',cat:'Recovery Community',pts:200,q:'What is one benefit of peer recovery support?',choices:['Replacing all professional care','Shared experience and encouragement','Guaranteed abstinence','Avoiding accountability'],a:1},
{g:'wheel',cat:'Coping Skills',pts:200,q:'DEEP BREATHING',hint:'A calming practice'},
{g:'wheel',cat:'Recovery',pts:200,q:'ONE DAY AT A TIME',hint:'Recovery saying'},
{g:'wheel',cat:'Connection',pts:200,q:'ASK FOR SUPPORT',hint:'Helpful action'},
{g:'wheel',cat:'Emotional Regulation',pts:200,q:'NAME THE FEELING',hint:'Awareness skill'},
{g:'wheel',cat:'Relapse Prevention',pts:200,q:'MAKE A SAFETY PLAN',hint:'Preparation before high-risk moments'},
{g:'feud',cat:'Relapse Prevention',pts:100,q:'Name something someone can do when experiencing a craving.',answers:['Call a support person','Use a grounding exercise','Change environment','Go for a walk','Practice breathing','Attend a meeting']},
{g:'feud',cat:'Daily Recovery',pts:100,q:'Name something that can support a healthier routine.',answers:['Get enough sleep','Eat regular meals','Exercise','Attend groups','Plan the day','Connect with others']},
{g:'feud',cat:'Emotional Regulation',pts:100,q:'Name a healthy way to manage anger.',answers:['Take a break','Breathe slowly','Talk it through','Journal','Exercise','Use grounding']},
{g:'feud',cat:'Recovery Support',pts:100,q:'Name someone a person can reach out to for support.',answers:['Counselor','Sponsor','Peer','Trusted family member','Recovery group','Supportive friend']},
{g:'feud',cat:'Triggers',pts:100,q:'Name an early warning sign of increased relapse risk.',answers:['Isolation','Skipping support','Sleep changes','Rising stress','Romanticizing past use','Secrecy']}
];
const GAMES=[['jeopardy','🧠','Recovery Jeopardy','Timed multiple-choice questions'],['wheel','🎡','Wheel of Fortune','Guess letters or solve the phrase'],['feud','👥','Recovery Family Feud','Submit answers; facilitator awards points']];
const TEAMS=['Team Sunrise','Team Horizon','Team Strength','Team Renewal'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);const rand=()=>String(Math.floor(100000+Math.random()*900000));
let db=null,auth=null,uid=null,live=false,role='landing',code='',session=null,unsub=null,playerName='',picked='',localBank=loadBank(),hostKey=null,hostAnswers={};
let previewPlayers={},previewResponses={},lastTimerValue=null,soundOn=true,route=new URLSearchParams(location.search);
function loadBank(){try{let v=JSON.parse(localStorage.getItem('rcrBank')||'null');return Array.isArray(v)&&v.length?v:QUESTIONS.slice()}catch{return QUESTIONS.slice()}}
function saveBank(){localStorage.setItem('rcrBank',JSON.stringify(localBank));toast('Question bank saved on this device')}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
function beep(freq=680){if(!soundOn)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(a.destination);g.gain.value=.09;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.stop(a.currentTime+.19);setTimeout(()=>a.close(),600)}catch{}}
function clean(s,n=80){return String(s||'').trim().slice(0,n)}
function link(){return location.origin+location.pathname+'?join='+code}
function setConnection(){ $('#connection').textContent=live?'● Live multiplayer':'○ Local preview';}
async function initialize(){try{if(FIREBASE_CONFIG&&window.firebase&&FIREBASE_CONFIG.databaseURL){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();await auth.signInAnonymously();uid=auth.currentUser.uid;live=true;}}catch(e){console.error(e);toast('Online setup failed: '+e.message)}setConnection();if(route.get('join')){code=clean(route.get('join'),6).replace(/\D/g,'');role='join';}render()}
function initialSession(mode){return {hostUid:uid||'preview',mode,game:'jeopardy',status:'lobby',round:0,questionIndex:-1,question:null,deadline:0,duration:15,revealed:false,revealedLetters:'',found:[],message:'Waiting for host to start',createdAt:Date.now(),teams:TEAMS}}
async function hostCreate(){if(!live){role='host';code='PREVIEW';session=initialSession($('#mode').value);previewPlayers={};previewResponses={};render();return}hostKey=crypto.randomUUID();let c;for(let i=0;i<5;i++){c=rand();if(!(await db.ref('sessions/'+c).once('value')).exists())break}code=c;session=initialSession($('#mode').value);await db.ref('sessions/'+code).set(session);localStorage.setItem('rcrHostSession',JSON.stringify({code,hostToken:hostKey}));role='host';subscribe();render()}
function subscribe(){if(!live)return;if(unsub)unsub();const r=db.ref('sessions/'+code);const cb=s=>{if(!s.exists()){session=null;toast('This session ended');role='landing';render();return}session=s.val();render()};r.on('value',cb,e=>toast('Session error: '+e.message));unsub=()=>r.off('value',cb)}
async function joinSession(){let c=clean($('#joinCode').value,6).replace(/\D/g,'');let n=clean($('#nickname').value,25);if(!live){toast('Phone joining requires Firebase setup and GitHub Pages hosting.');return}if(c.length!==6||!n){toast('Enter a six-digit PIN and nickname');return}let snap=await db.ref('sessions/'+c).once('value');if(!snap.exists()){toast('No active session with that PIN');return}code=c;playerName=n;const team=($('#teamPicker')?.value||TEAMS[0]);if(!snap.child('players/'+uid).exists())await db.ref('sessions/'+code+'/players/'+uid).set({name:n,team,score:0,joinedAt:Date.now()});role='player';subscribe();render()}
async function update(patch){if(!session)return;if(live){await db.ref('sessions/'+code).update(patch)}else{Object.assign(session,patch);render()}}
function players(){return session?.players||previewPlayers}
function responses(){return session?.responses||previewResponses}
async function selectGame(g){await update({game:g,status:'lobby',question:null,questionIndex:-1,deadline:0,revealed:false,revealedLetters:'',found:[],responses:null,message:'Select a question to begin'})}
function gameQs(){return localBank.filter(q=>q.g===session.game)}
async function startQuestion(i){const q=gameQs()[i];if(!q)return;hostAnswers[code+'-'+(session.round+1)]=q;let published={g:q.g,cat:q.cat,pts:Number(q.pts)||100,q:q.q,hint:q.hint||'',choices:q.choices||[],length:q.g==='wheel'?q.q.length:0,answersCount:q.g==='feud'?(q.answers||[]).length:0};if(q.g==='wheel'){published.pattern=q.q.replace(/[A-Z]/gi,'_')}await update({questionIndex:i,round:(session.round||0)+1,question:published,status:'playing',deadline:Date.now()+Number(session.duration||15)*1000,revealed:false,revealedLetters:'',found:[],responses:null,message:'Answer from your phone!' });beep()}
async function restartTimer(){await update({deadline:Date.now()+Number(session.duration||15)*1000,status:'playing',message:'Time is running'})}
async function stopTimer(){await update({deadline:0,status:'paused',message:'Timer paused'})}
function answerForRound(){return hostAnswers[code+'-'+session.round]||gameQs()[session.questionIndex]}
function resultKey(){return 'round'+session.round}
async function sendAnswer(v){if(!live){toast('Local preview: phone participation needs online setup');return}if(!session||session.status!=='playing'||!session.deadline||Date.now()>session.deadline){toast('This round is closed');return}if(responses()[uid]){toast('Answer already submitted');return}await db.ref('sessions/'+code+'/responses/'+uid).set({value:clean(v,140),createdAt:Date.now()});beep(840);toast('Answer sent')}
async function scoreUser(id,points){if(!live){const p=previewPlayers[id];if(p){p.score=(p.score||0)+points;render()}return}const r=db.ref('sessions/'+code+'/players/'+id+'/score');await r.transaction(x=>(x||0)+points)}
async function reveal(){if(session?.revealed)return toast('This round was already scored');let q=answerForRound();if(!q)return;let patch={status:'revealed',deadline:0,revealed:true,message:'Round complete'};if(q.g==='wheel')patch.revealedLetters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(q.g==='feud')patch.found=(q.answers||[]).map((_,i)=>i);await update(patch);if(q.g==='jeopardy'&&live){let rs=responses(),ps=players();for(let [id,r] of Object.entries(rs)){if(!ps[id])continue;const correct=Number(r.value)===Number(q.a);if(correct)await scoreUser(id,Number(q.pts)||100)}}beep(940)}
async function revealLetter(){let letter=clean($('#letterBox')?.value,1).toUpperCase();if(!/^[A-Z]$/.test(letter))return toast('Choose a letter A–Z');await update({revealedLetters:(session.revealedLetters||'')+letter});beep()}
async function markFeud(idx){let f=session.found||[];if(f.includes(idx))f=f.filter(x=>x!==idx);else f=[...f,idx];await update({found:f})}
async function resetScores(){if(!confirm('Reset all player scores?'))return;for(let id of Object.keys(players())){if(live)await db.ref('sessions/'+code+'/players/'+id+'/score').set(0);else previewPlayers[id].score=0}render()}
async function endSession(){if(!confirm('End this game room for everyone?'))return;if(live)await db.ref('sessions/'+code).remove();if(unsub)unsub();localStorage.removeItem('rcrHostSession');role='landing';session=null;code='';render()}
function board(){let qs=gameQs();if(!qs.length)return '<p>No questions. Add one in the facilitator editor.</p>';if(session.game==='jeopardy'){let cats=[...new Set(qs.map(q=>q.cat))];return '<div class="grid">'+cats.map(c=>'<div><h3>'+esc(c)+'</h3>'+qs.map((q,i)=>q.cat===c?`<button class="secondary" style="width:100%;margin:3px 0" onclick="startQuestion(${i})">${esc(q.pts)} points</button>`:'').join('')+'</div>').join('')+'</div>'}return '<div class="grid">'+qs.map((q,i)=>`<button class="secondary" onclick="startQuestion(${i})">${esc(q.cat)} · ${esc(q.q)}</button>`).join('')+'</div>'}
function getTime(){if(!session?.deadline)return 0;return Math.max(0,Math.ceil((session.deadline-Date.now())/1000))}
function puzzle(q){let original=answerForRound()?.q||'';let visible=session.revealedLetters||'';return original.split('').map(c=>/[A-Z]/i.test(c)&&!visible.includes(c.toUpperCase())?'▢':c).join(' ')}
function scoreTable(){let ps=Object.entries(players()).map(([id,p])=>({id,...p}));if(!ps.length)return '<p class="muted">No clients joined yet.</p>';if(session.mode==='teams'){const scores=TEAMS.map(t=>({team:t,score:ps.filter(p=>p.team===t).reduce((sum,p)=>sum+(p.score||0),0),count:ps.filter(p=>p.team===t).length}));return '<div class="grid">'+scores.map(p=>`<div class="team">${esc(p.team)} · ${p.count} clients <b class="score">${p.score}</b></div>`).join('')+'</div>'}return '<div class="grid">'+ps.sort((a,b)=>(b.score||0)-(a.score||0)).map(p=>`<div class="team">${esc(p.name)} <b class="score">${p.score||0}</b></div>`).join('')+'</div>'}
function hostRound(){if(!session.question)return `<div class="panel"><h2>Choose a question</h2>${board()}</div>`;let q=session.question,ans=answerForRound(),rs=responses(),ps=players();return `<div class="panel"><div class="row spread"><span class="pill">${esc(GAMES.find(x=>x[0]===session.game)?.[2])} · ${esc(q.cat)} · ${esc(q.pts)} pts</span><span id="timer" class="timer">${getTime()}</span></div><div class="question">${esc(q.q)}</div>${q.hint?`<p>Hint: ${esc(q.hint)}</p>`:''}${q.g==='jeopardy'?`<div class="choices">${q.choices.map((c,i)=>`<div class="choice ${session.revealed&&ans?.a===i?'correct':''}" style="padding:12px;border-radius:10px">${String.fromCharCode(65+i)}. ${esc(c)}</div>`).join('')}</div>`:''}${q.g==='wheel'?`<div class="puzzle">${esc(puzzle(q))}</div><div class="row"><input id="letterBox" maxlength="1" placeholder="Letter"><button class="secondary" onclick="revealLetter()">Reveal letter</button></div>`:''}${q.g==='feud'?`<div class="grid">${(ans?.answers||[]).map((a,i)=>`<button onclick="markFeud(${i})" class="${(session.found||[]).includes(i)?'':'secondary'}">${(session.found||[]).includes(i)?esc(a):'Answer '+(i+1)+' · Tap to reveal'}</button>`).join('')}</div>`:''}<div class="row" style="margin-top:16px"><button onclick="restartTimer()">↻ Start 15-sec timer</button><button class="secondary" onclick="stopTimer()">Pause</button><button onclick="reveal()">Reveal / Close round</button><button class="secondary" onclick="update({question:null,status:'lobby',deadline:0,responses:null})">New question</button></div>${session.revealed?`<div class="status">${q.g==='jeopardy'?'Correct answer: '+esc(ans?.choices?.[ans?.a]):q.g==='wheel'?'Solution: '+esc(ans?.q):'All survey answers revealed'}</div>`:''}</div><div class="panel"><h2>Responses (${Object.keys(rs).length})</h2>${Object.entries(rs).length?Object.entries(rs).map(([id,r])=>`<div class="submission submit-card"><div><b>${esc(ps[id]?.name||'Player')}</b> <span class="tag">${esc(ps[id]?.team||'')}</span><div>${q.g==='jeopardy'?esc(q.choices[Number(r.value)]||'Unknown'):esc(r.value)}</div></div><div class="row"><button class="secondary" onclick="scoreUser('${id}',${Number(q.pts)||100})">+${esc(q.pts)} pts</button><button class="secondary" onclick="scoreUser('${id}',-${Number(q.pts)||100})">−${esc(q.pts)} pts</button></div></div>`).join(''):'<p class="muted">Waiting for answers from connected phones.</p>'}<p class="note">Jeopardy awards correct answers automatically when you click Reveal. Manual +/− buttons are for corrections, Wheel, and Feud. Avoid scoring the same response twice.</p></div>`}
function renderHost(){let share=live?`<div class="pin">${code}</div><p>Clients open <a target="_blank" href="${esc(link())}">${esc(link())}</a></p><div class="row"><button onclick="copyJoin()">Copy join link</button><button class="secondary" onclick="window.print()">Print page</button></div>`:`<div class="status warn"><b>Local preview only.</b> The host dashboard and question bank work here. To connect clients on their own phones, configure Firebase and publish this file on GitHub Pages.</div>`;
return `<div class="panel"><div class="row spread"><div><h1>Facilitator dashboard</h1><p class="muted">${session.mode==='teams'?'Team competition':'Individual scoring'} · ${Object.keys(players()).length} joined</p></div><button class="danger" onclick="endSession()">End room</button></div>${share}</div><div class="panel"><div class="row spread"><h2>Choose a game</h2><div class="row"><label>Timer (seconds)<input type="number" min="5" max="120" style="width:95px" value="${session.duration||15}" onchange="update({duration:Math.min(120,Math.max(5,Number(this.value)||15))})"></label><button class="secondary" onclick="soundOn=!soundOn;toast('Sound '+(soundOn?'on':'off'))">🔊 Toggle sound</button></div></div><div class="gamegrid">${GAMES.map(g=>`<div class="gamecard ${session.game===g[0]?'selected':''}" onclick="selectGame('${g[0]}')"><div style="font-size:32px">${g[1]}</div><b>${g[2]}</b><p class="small">${g[3]}</p></div>`).join('')}</div></div>${hostRound()}<div class="panel"><div class="row spread"><h2>Live scoreboard</h2><button class="secondary" onclick="resetScores()">Reset scores</button></div>${scoreTable()}</div><div class="panel"><details><summary>✏️ Add / edit game questions</summary><p class="note">Custom questions are saved in this facilitator's browser. Publish the updated HTML to make built-in content universal.</p><div class="grid"><label>Game<select id="editGame"><option value="jeopardy">Jeopardy</option><option value="wheel">Wheel of Fortune</option><option value="feud">Family Feud</option></select></label><label>Category<input id="editCat" placeholder="Recovery Skills"></label><label>Points<input id="editPts" type="number" value="100" min="1"></label></div><label>Question or puzzle phrase<input id="editQ" placeholder="Enter your question"></label><label>Options / survey answers (one per line). For Jeopardy, enter four options and make the first correct.<textarea id="editAnswers" placeholder="Correct answer\nOther answer\nOther answer\nOther answer"></textarea></label><button onclick="addQuestion()">Add question</button> <button class="secondary" onclick="exportBank()">Export questions JSON</button> <button class="secondary" onclick="document.getElementById('importBank').click()">Import questions</button><input class="hidden" id="importBank" type="file" accept="application/json" onchange="importBank(event)"><button class="danger" onclick="resetBank()">Restore built-in questions</button><p class="note">To change which Jeopardy option is correct, import a JSON bank with the <code>a</code> index (0–3). Or put the correct option first when adding questions.</p></details></div>`}
function renderPlayer(){if(!session)return '<div class="panel">Loading room…</div>';let p=players()?.[uid];if(!p)return '<div class="panel"><h2>Not in room</h2><button onclick="role=\'join\';render()">Join again</button></div>';let q=session.question;let r=responses()[uid];return `<div class="panel"><div class="row spread"><div><h1>Hello, ${esc(p.name)}!</h1><span class="pill">${esc(session.mode==='teams'?p.team:'Individual mode')} · ${esc(code)}</span></div><span class="score">${p.score||0} pts</span></div></div><div class="panel"><div class="row spread"><span class="pill">${esc(GAMES.find(g=>g[0]===session.game)?.[2])}</span><span id="timer" class="timer">${getTime()}</span></div>${!q?`<div class="bigcenter"><h2>You're in!</h2><p>Waiting for facilitator to start a question.</p></div>`:`<div><div class="question">${esc(q.q)}</div>${q.hint?`<p>Hint: ${esc(q.hint)}</p>`:''}${q.g==='wheel'?`<div class="puzzle">${esc((q.pattern||'').split('').map((c,i)=>{const original=String(q.q||'')[i];return /[A-Z]/i.test(original)&&!(session.revealedLetters||'').includes(original.toUpperCase())?'▢':original}).join(' '))}</div>`:''}${r?`<div class="status">✓ Your answer was submitted: ${esc(q.g==='jeopardy'?q.choices[Number(r.value)]:r.value)}</div>`:session.status==='playing'&&getTime()>0?(q.g==='jeopardy'?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="sendAnswer('${i}')">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>`:`<label>Your ${q.g==='wheel'?'letter or full phrase':'survey answer'}<input id="typedAnswer" maxlength="140" placeholder="Type your answer"></label><button style="margin-top:12px" onclick="sendAnswer(document.getElementById('typedAnswer').value)">Submit answer</button>`):`<div class="status">${session.revealed?'Round complete!':'Time is up or facilitator paused the round.'}</div>`}</div>`}</div><div class="panel"><h2>Scoreboard</h2>${scoreTable()}</div>`}
function render(){if(!$('#app'))return;if(role==='landing'){ $('#app').innerHTML=`<div class="bigcenter"><h1>Recovery games, together.</h1><p class="muted">Host from your iPad. Clients answer from their own phones.</p></div><div class="grid"><div class="panel"><h2>🎮 Facilitator</h2><p>Create a room, lead the games, and control scoring.</p><label>Competition mode<select id="mode"><option value="individual">Individual players</option><option value="teams">Teams</option></select></label><br><button class="wide" onclick="hostCreate()">Create game room</button></div><div class="panel"><h2>📱 Client</h2><p>Enter the room PIN from your facilitator.</p><button class="wide secondary" onclick="role='join';render()">Join a game</button></div></div><div class="panel"><h2>Included games</h2><div class="gamegrid">${GAMES.map(g=>`<div class="gamecard"><div style="font-size:32px">${g[1]}</div><b>${g[2]}</b><p class="small">${g[3]}</p></div>`).join('')}</div></div>${!live?'<div class="status warn">This copy opens in local preview mode until the facilitator adds Firebase settings. The online multiplayer setup is described in README.md.</div>':''}`;return}if(role==='join'){ $('#app').innerHTML=`<div class="panel" style="max-width:550px;margin:24px auto"><h1>Join game room</h1><label>6-digit room PIN<input id="joinCode" inputmode="numeric" maxlength="6" placeholder="123456" value="${esc(code)}"></label><br><label>Nickname (not your full name)<input id="nickname" maxlength="25" placeholder="e.g. Sunshine"></label><br><label>Team (only used for team games)<select id="teamPicker">${TEAMS.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><br><button class="wide" onclick="joinSession()">Join game</button><p class="note">Do not use full names or share medical information.</p><button class="secondary" onclick="role='landing';render()">Back</button></div>`;return}$('#app').innerHTML=role==='host'?renderHost():renderPlayer()}
function copyJoin(){navigator.clipboard.writeText(link()).then(()=>toast('Link copied')).catch(()=>prompt('Copy link:',link()))}
function addQuestion(){let g=$('#editGame').value,cat=clean($('#editCat').value,55),q=clean($('#editQ').value,160),pts=Math.max(1,Number($('#editPts').value)||100),answers=$('#editAnswers').value.split('\n').map(v=>clean(v,120)).filter(Boolean);if(!cat||!q)return toast('Enter a category and question');let v={g,cat,pts,q};if(g==='jeopardy'){if(answers.length!==4)return toast('Jeopardy needs four options (correct one first)');v.choices=answers;v.a=0}if(g==='feud'){if(answers.length<2)return toast('Family Feud needs at least two survey answers');v.answers=answers}if(g==='wheel'){v.q=q.toUpperCase();v.hint=answers[0]||cat}localBank.push(v);saveBank();render()}
function exportBank(){let b=new Blob([JSON.stringify(localBank,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RCR_Game_Questions.json';a.click();URL.revokeObjectURL(a.href)}
function importBank(event){let f=event.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data)||!data.every(q=>['jeopardy','wheel','feud'].includes(q.g)&&typeof q.q==='string'&&typeof q.cat==='string'))throw Error('Invalid question format');localBank=data;saveBank();render()}catch(e){toast('Import error: '+e.message)}};reader.readAsText(f)}
function resetBank(){if(confirm('Restore built-in questions? Custom questions on this device will be erased.')){localBank=QUESTIONS.slice();saveBank();render()}}
setInterval(()=>{let t=$('#timer');if(!t||!session)return;let n=getTime();t.textContent=n;t.classList.toggle('low',n<=5);if(role==='host'&&session.status==='playing'&&n>0&&n<=3&&lastTimerValue!==n)beep(500);lastTimerValue=n},200);
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Error: '+(e.reason?.message||'Check network and settings'))});initialize();
</script></body></html>
